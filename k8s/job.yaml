apiVersion: batch/v1
kind: Job
metadata:
  name: vulnerability-agent
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: example.invalid/vulnerability-agent:latest
          args:
            - --query
            - Досліди CVE-2021-44228, перевір KEV та EPSS і запропонуй мітігації
          envFrom:
            - secretRef:
                name: vulnerability-agent-openai
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: tmp
          emptyDir: {}
